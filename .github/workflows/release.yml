name: Release

# Push a tag like v1.2.3 to build, test and publish a release.
# The tag is the only source of the version number: it is passed to
# dotnet as /p:Version, nothing in source tracks it.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # RequiresDesktop tests call Window.Show(), which needs a real presentation source. They
      # pass locally; whether this runner tolerates them has not been verified, and finding out
      # by breaking a release is the wrong trade. Drop the filter to let them run in CI.
      - name: Test
        run: >
          dotnet test --solution WinTabber.slnx -c Release
          -- --treenode-filter "/*/*/*/*[Category!=RequiresDesktop]"

      # WinTabberUI.csproj sets PublishReadyToRun=true, so the default Release publish is R2R.
      # The three variants below override it explicitly so the csproj default can change freely.
      # The Release variants set DebugType=none, so no .pdb files go into the zip.
      # The R2R zip keeps the plain name: the winget job and existing installs depend on it.
      - name: Publish and zip variants
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $variants = @(
            @{ Suffix = '';        Config = 'Release'; R2R = 'true';  Debug = 'none' },
            @{ Suffix = '-nor2r';  Config = 'Release'; R2R = 'false'; Debug = 'none' },
            @{ Suffix = '-debug';  Config = 'Debug';   R2R = 'false'; Debug = 'portable' }
          )
          foreach ($v in $variants) {
            $out = "publish$($v.Suffix)"
            dotnet publish WinTabberUI/WinTabberUI.csproj `
              -c $v.Config `
              -r win-x64 `
              --self-contained true `
              "-p:Version=$env:VERSION" `
              "-p:PublishReadyToRun=$($v.R2R)" `
              "-p:DebugType=$($v.Debug)" `
              -p:PublishSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true `
              -o $out
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Compress-Archive -Path "$out\*" -DestinationPath "WinTabber-$env:VERSION-win-x64$($v.Suffix).zip"
          }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WinTabber-${{ steps.version.outputs.version }}-win-x64.zip
            WinTabber-${{ steps.version.outputs.version }}-win-x64-nor2r.zip
            WinTabber-${{ steps.version.outputs.version }}-win-x64-debug.zip
          generate_release_notes: true

  winget:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Publish to Windows Package Manager Community Repository
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: kbirger.WinTabber
          installers-regex: 'win-x64\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
